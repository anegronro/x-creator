[project]
name = "xcreator"
version = "0.1.0"
description = "Agente de contenido para X — analiza engagement, redacta y encola"
requires-python = ">=3.11"
dependencies = [
  "typer>=0.12", "httpx>=0.27", "scipy>=1.13",
  "pydantic>=2.7", "python-dotenv>=1.0", "anthropic>=0.40",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
xc = "xcreator.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
